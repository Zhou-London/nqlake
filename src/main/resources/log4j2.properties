rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = stderr

logger.localAddress.name = org.apache.spark.util.Utils
logger.localAddress.level = error
logger.missingPath.name = org.apache.spark.sql.execution.streaming.sinks.FileStreamSink
logger.missingPath.level = error
logger.mergeFilter.name = org.apache.spark.sql.execution.datasources.v2.DataSourceV2Strategy
logger.mergeFilter.level = error
logger.planString.name = org.apache.spark.util.SparkStringUtils
logger.planString.level = error
logger.nativeHadoop.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativeHadoop.level = error

appender.stderr.type = Console
appender.stderr.name = stderr
appender.stderr.target = SYSTEM_ERR
appender.stderr.layout.type = PatternLayout
appender.stderr.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n%ex
