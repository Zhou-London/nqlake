<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Query latency per request: a shared DuckDB database with a cursor per request against a new database per request, for three queries">
<title>Query latency per request</title>
<rect width="720" height="330" fill="#fcfcfb"/>
<text x="24" y="32" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b">Query latency per request</text>
<text x="24" y="52" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">Median of 15 runs, in milliseconds. Lower is better.</text>
<rect x="24" y="69" width="12" height="12" rx="2" fill="#c3c2b7"/>
<text x="42" y="79" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">New DuckDB database per request</text>
