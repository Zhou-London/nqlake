<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="Arrow socket throughput by batch size: end to end stays between 730 and 790 MB/s from 1,024 to 1,000,000 rows per batch, while DuckDB producing batches alone and the socket sending them alone each reach about 1,550 MB/s">
<title>Arrow socket throughput by batch size</title>
<rect width="720" height="370" fill="#fcfcfb"/>
<text x="24" y="32" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">Arrow socket throughput by batch size</text>
<text x="24" y="52" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e" text-anchor="start">Full table, 47.6 million rows, 4.1 GB, in MB/s. Higher is better.</text>
<rect x="24" y="69" width="12" height="12" rx="2" fill="#2a78d6"/><text x="42" y="79" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e" text-anchor="start">End to end, as the receiver sees it</text>
