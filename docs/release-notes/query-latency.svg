<text x="220" y="133.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e" text-anchor="end">SELECT 1</text>
<path d="M232.00 110.00 H342.65 a4.00 4.00 0 0 1 4.00 4.00 V124.00 a4.00 4.00 0 0 1 -4.00 4.00 H232.00 Z" fill="#c3c2b7"/>
<text x="354.6" y="123" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0b0b0b" font-variant-numeric="tabular-nums">28.1 ms</text>
