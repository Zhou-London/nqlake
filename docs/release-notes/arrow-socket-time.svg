<svg xmlns="http://www.w3.org/2000/svg" width="720" height="374" viewBox="0 0 720 374" role="img" aria-label="Where a full-table transfer spends its time, by batch size: about 2.6 seconds of DuckDB producing batches followed by about 2.7 seconds of socket sends, in one thread, for a total near 5.3 seconds at every batch size from 4,096 rows up; 1,024-row batches take 6.2 seconds">
