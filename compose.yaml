# The compose service to launch NQLake: MinIO (Parquet objects), Postgres +
# Lakekeeper (Iceberg REST catalog), and DuckDB (query engine). `docker
# compose up -d` brings up the stores and runs the one-shot init jobs;
#
# Configure ports binding in .env or in UI.
#
# Images are defined in ../../Dockerfiles/lakehouse-*; persistent data is
# bind-mounted from ./images (see README for the naming plan).

name: lakehouse

services:
  minio:
    build: ../../Dockerfiles/lakehouse-minio
    image: lakehouse/minio
    command:
      - "server"
      - "/data"
      - "--address"
      - ":${MINIO_API_PORT:?}"
      - "--console-address"
      - ":${MINIO_CONSOLE_PORT:?}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - ./images/minio/data:/data
    ports:
      - "${MINIO_API_PORT:?}:${MINIO_API_PORT:?}" # S3 API
      - "${MINIO_CONSOLE_PORT:?}:${MINIO_CONSOLE_PORT:?}" # web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_API_PORT}/minio/health/live"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 10s

  # One-shot: warehouse bucket + the non-root user Lakekeeper vends STS
  # credentials with (MinIO refuses AssumeRole for root).
  minio-init:
    build: ../../Dockerfiles/lakehouse-mc
    image: lakehouse/mc
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/lakehouse/scripts/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_API_PORT: ${MINIO_API_PORT:?}
      LAKEHOUSE_S3_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?}
      LAKEHOUSE_S3_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:?}
    volumes:
      - ./scripts:/opt/lakehouse/scripts:ro
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    build: ../../Dockerfiles/lakehouse-postgres
    image: lakehouse/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # Read by the server and by every libpq client in the container,
      # pg_isready below included.
      PGPORT: ${POSTGRES_PORT:?}
    volumes:
      - ./images/postgres/data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:?}:${POSTGRES_PORT:?}" # catalog metadata DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 10s

  lakekeeper-migrate:
    build: ../../Dockerfiles/lakehouse-lakekeeper
    image: lakehouse/lakekeeper
    restart: "no"
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:?}/${POSTGRES_DB}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:?}/${POSTGRES_DB}
      LAKEKEEPER__LISTEN_PORT: ${LAKEKEEPER_PORT:?}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  lakekeeper:
    build: ../../Dockerfiles/lakehouse-lakekeeper
    image: lakehouse/lakekeeper
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "${LAKEKEEPER_PORT:?}:${LAKEKEEPER_PORT:?}" # REST catalog + management API + UI
    healthcheck:
      # Probes LAKEKEEPER__LISTEN_PORT, so it follows the variable too.
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # One-shot: bootstrap the catalog, create the warehouse on MinIO, and point
  # an existing warehouse at MinIO's current port.
  lakekeeper-init:
    build: ../../Dockerfiles/lakehouse-duckdb
    image: lakehouse/duckdb
    restart: "no"
    command: ["bash", "/opt/lakehouse/scripts/lakekeeper-init.sh"]
    environment:
      LAKEHOUSE_WAREHOUSE: ${LAKEHOUSE_WAREHOUSE:?}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:?}
      LAKEHOUSE_S3_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?}
      LAKEHOUSE_S3_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?}
      LAKEKEEPER_PORT: ${LAKEKEEPER_PORT:?}
      MINIO_API_PORT: ${MINIO_API_PORT:?}
    volumes:
      - ./scripts:/opt/lakehouse/scripts:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Interactive SQL shell: `docker compose run --rm duckdb`. The entrypoint
  # renders sql/attach.sql.template into /tmp/attach.sql first, so the client
  # attaches this stack's warehouse on this stack's catalog port.
  duckdb:
    build: ../../Dockerfiles/lakehouse-duckdb
    image: lakehouse/duckdb
    profiles: ["client"]
    entrypoint: ["/opt/lakehouse/scripts/duckdb-entrypoint.sh"]
    command: ["duckdb", "-init", "/tmp/attach.sql"]
    environment: &duckdb-env
      LAKEHOUSE_WAREHOUSE: ${LAKEHOUSE_WAREHOUSE:?}
      LAKEKEEPER_PORT: ${LAKEKEEPER_PORT:?}
    stdin_open: true
    tty: true
    volumes:
      - ./scripts:/opt/lakehouse/scripts:ro
      - ./sql:/opt/lakehouse/sql:ro
      - ./images/duckdb/work:/work
    depends_on:
      lakekeeper:
        condition: service_healthy
      lakekeeper-init:
        condition: service_completed_successfully

  # End-to-end check: writes an Iceberg table through the catalog into MinIO
  # and reads it back. `docker compose run --rm smoke-test`.
  smoke-test:
    build: ../../Dockerfiles/lakehouse-duckdb
    image: lakehouse/duckdb
    profiles: ["test"]
    restart: "no"
    entrypoint: ["/opt/lakehouse/scripts/duckdb-entrypoint.sh"]
    command: ["bash", "/opt/lakehouse/scripts/smoke-test.sh"]
    environment: *duckdb-env
    volumes:
      - ./scripts:/opt/lakehouse/scripts:ro
      - ./sql:/opt/lakehouse/sql:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      lakekeeper-init:
        condition: service_completed_successfully
