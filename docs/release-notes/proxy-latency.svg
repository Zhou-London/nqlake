<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Latency per request, direct to the API against through the console proxy: SELECT 1 in 2.5 ms against 3.4 ms, describing a table in 8.0 ms against 10.9 ms, and count(*) over 47.6 million rows in 10.9 ms against 14.9 ms">
<title>Proxy hop cost per request</title>
<rect width="720" height="330" fill="#fcfcfb"/>
<text x="24" y="32" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b">Proxy hop cost per request</text>
<text x="24" y="52" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">Median of 31 runs from a client on the same host, in milliseconds. Lower is better.</text>
<rect x="24" y="69" width="12" height="12" rx="2" fill="#c3c2b7"/>
<text x="42" y="79" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">Direct to the API on :40004</text>
<rect x="274" y="69" width="12" height="12" rx="2" fill="#2a78d6"/>
<text x="292" y="79" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e">Through the console proxy on :40001</text>
<line x1="232.0" y1="100" x2="232.0" y2="282" stroke="#e1e0d9" stroke-width="1"/>
<text x="232.0" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">0</text>
<line x1="334.0" y1="100" x2="334.0" y2="282" stroke="#e1e0d9" stroke-width="1"/>
<text x="334.0" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">4</text>
<line x1="436.0" y1="100" x2="436.0" y2="282" stroke="#e1e0d9" stroke-width="1"/>
<text x="436.0" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">8</text>
<line x1="538.0" y1="100" x2="538.0" y2="282" stroke="#e1e0d9" stroke-width="1"/>
<text x="538.0" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">12</text>
<line x1="640.0" y1="100" x2="640.0" y2="282" stroke="#e1e0d9" stroke-width="1"/>
<text x="640.0" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">16</text>
<text x="640" y="314" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="end">milliseconds</text>
<line x1="232" y1="100" x2="232" y2="282" stroke="#c3c2b7" stroke-width="1"/>
<text x="220" y="133" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e" text-anchor="end">SELECT 1</text>
<path d="M232.00 110.00 H291.75 a4.00 4.00 0 0 1 4.00 4.00 V124.00 a4.00 4.00 0 0 1 -4.00 4.00 H232.00 Z" fill="#c3c2b7"/>
<text x="303.8" y="123" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0b0b0b" font-variant-numeric="tabular-nums">2.5 ms</text>
<path d="M232.00 130.00 H314.70 a4.00 4.00 0 0 1 4.00 4.00 V144.00 a4.00 4.00 0 0 1 -4.00 4.00 H232.00 Z" fill="#2a78d6"/>
<text x="326.7" y="143" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0b0b0b" font-variant-numeric="tabular-nums">3.4 ms</text>
<text x="220" y="193" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e" text-anchor="end">GET table (describe)</text>
<path d="M232.00 170.00 H432.00 a4.00 4.00 0 0 1 4.00 4.00 V184.00 a4.00 4.00 0 0 1 -4.00 4.00 H232.00 Z" fill="#c3c2b7"/>
<text x="444.0" y="183" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0b0b0b" font-variant-numeric="tabular-nums">8.0 ms</text>
<path d="M232.00 190.00 H505.95 a4.00 4.00 0 0 1 4.00 4.00 V204.00 a4.00 4.00 0 0 1 -4.00 4.00 H232.00 Z" fill="#2a78d6"/>
<text x="518.0" y="203" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0b0b0b" font-variant-numeric="tabular-nums">10.9 ms</text>
<text x="220" y="253" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#52514e" text-anchor="end">count(*) on 47.6M rows</text>
<path d="M232.00 230.00 H505.95 a4.00 4.00 0 0 1 4.00 4.00 V244.00 a4.00 4.00 0 0 1 -4.00 4.00 H232.00 Z" fill="#c3c2b7"/>
<text x="518.0" y="243" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0b0b0b" font-variant-numeric="tabular-nums">10.9 ms</text>
<path d="M232.00 250.00 H607.95 a4.00 4.00 0 0 1 4.00 4.00 V264.00 a4.00 4.00 0 0 1 -4.00 4.00 H232.00 Z" fill="#2a78d6"/>
<text x="620.0" y="263" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0b0b0b" font-variant-numeric="tabular-nums">14.9 ms</text>
</svg>
