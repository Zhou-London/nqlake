[project]
name = "nqlake"
version = "0.1.0"
description = "Backend API of the NQ Lake Iceberg lakehouse"
requires-python = ">=3.14"
# Both engines are pinned to exact versions. The Iceberg extension is built
# per DuckDB release, and its write support still changes between releases:
# which types it accepts, which format version it writes. To upgrade, change
# the version here, run `uv lock`, then `make up` and try an upload and a query.
dependencies = [
    # DuckDB computes: SQL queries over the catalog.
    "duckdb==1.5.5",
    # PyIceberg manages: creating, loading, writing, and dropping tables
    # through the catalog. Its write path and type mapping change between
    # releases. The pyarrow extra provides file IO and the row format.
    # pyiceberg-core computes partition values (day(ts), bucket, ...) on write.
    "pyiceberg[pyarrow,pyiceberg-core]==0.12.0",
    # DuckDB's Python API needs pytz to return TIMESTAMP WITH TIME ZONE
    # values. Without pytz, a table with such a column cannot be read.
    "pytz>=2024.1",
    # The HTTP layer: FastAPI routes, uvicorn serves, python-multipart parses
    # Parquet uploads.
    "fastapi>=0.141.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
# backend/ holds the nqlake package and is put on sys.path by the Makefile;
# nothing is installed into the environment.
package = false
