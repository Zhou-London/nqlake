# The NQ Lake stack: MinIO holds the Parquet files, Postgres and Lakekeeper
# form the Iceberg REST catalog. `docker compose up -d` starts the stores and
# runs the one-shot init jobs. The backend API and DuckDB are not services.
# They run on the host; `make up` starts them (see Makefile, pyproject.toml).
#
# Every port is set in .env.
#
# Images are built from the Dockerfiles under DOCKERFILES_DIR (see x-images
# below). Service data is bind-mounted from ./images/<service>/data.

name: lakehouse

# The five images, each built from DOCKERFILES_DIR/lakehouse-<name>. Each
# service merges its image with `<<:`, so a shared image is defined once.
# DOCKERFILES_DIR is an absolute path set in .env. This repository and the
# one holding the Dockerfiles are cloned independently, so their relative
# location is not fixed.
x-images:
  minio: &minio-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-minio
    image: lakehouse/minio
  mc: &mc-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-mc
    image: lakehouse/mc
  postgres: &postgres-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-postgres
    image: lakehouse/postgres
  lakekeeper: &lakekeeper-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-lakekeeper
    image: lakehouse/lakekeeper
  init: &init-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-init
    image: lakehouse/init

services:
  minio:
    <<: *minio-image
    command:
      - "server"
      - "/data"
      - "--address"
      - ":${MINIO_API_PORT:?}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # The embedded web console is off: the lakehouse has its own console.
      MINIO_BROWSER: "off"
    volumes:
      - ./images/minio/data:/data
    ports:
      - "${MINIO_API_PORT:?}:${MINIO_API_PORT:?}" # S3 API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_API_PORT}/minio/health/live"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 10s

  # One-shot job: creates the warehouse bucket and the non-root user
  # Lakekeeper uses to vend STS credentials. MinIO refuses AssumeRole for
  # the root user.
  minio-init:
    <<: *mc-image
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/lakehouse/scripts/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_API_PORT: ${MINIO_API_PORT:?}
      LAKEHOUSE_S3_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?}
      LAKEHOUSE_S3_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:?}
    volumes:
      - ./scripts:/opt/lakehouse/scripts:ro
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    <<: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # PGPORT is read by the server and by every libpq client in the
      # container, including pg_isready in the healthcheck below.
      PGPORT: ${POSTGRES_PORT:?}
    volumes:
      - ./images/postgres/data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:?}:${POSTGRES_PORT:?}" # catalog metadata DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 10s

  lakekeeper-migrate:
    <<: *lakekeeper-image
    restart: "no"
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:?}/${POSTGRES_DB}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:?}/${POSTGRES_DB}
      LAKEKEEPER__LISTEN_PORT: ${LAKEKEEPER_PORT:?}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  lakekeeper:
    <<: *lakekeeper-image
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "${LAKEKEEPER_PORT:?}:${LAKEKEEPER_PORT:?}" # REST catalog, management API, web UI
    healthcheck:
      # The probe reads LAKEKEEPER__LISTEN_PORT, so it follows the port in .env.
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # One-shot job: bootstraps the catalog, creates the warehouse when the
  # catalog has none, and points an existing warehouse at MinIO's current port.
  lakekeeper-init:
    <<: *init-image
    restart: "no"
    command: ["bash", "/opt/lakehouse/scripts/lakekeeper-init.sh"]
    environment:
      LAKEHOUSE_WAREHOUSE: ${LAKEHOUSE_WAREHOUSE:?}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:?}
      LAKEHOUSE_S3_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?}
      LAKEHOUSE_S3_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?}
      LAKEKEEPER_PORT: ${LAKEKEEPER_PORT:?}
      MINIO_API_PORT: ${MINIO_API_PORT:?}
    volumes:
      - ./scripts:/opt/lakehouse/scripts:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
