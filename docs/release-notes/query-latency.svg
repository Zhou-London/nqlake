<text x="436.0" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">50</text>
<line x1="538.0" y1="100" x2="538.0" y2="282" stroke="#e1e0d9" stroke-width="1"/>
<text x="538.0" y="298" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="middle" font-variant-numeric="tabular-nums">75</text>
<line x1="640.0" y1="100" x2="640.0" y2="282" stroke="#e1e0d9" stroke-width="1"/>
