# The compose service to launch NQLake: MinIO (Parquet objects) and Postgres +
# Lakekeeper (Iceberg REST catalog). `docker compose up -d` brings up the
# stores and runs the one-shot init jobs. DuckDB, the query engine, is not a
# service: it runs inside nqlake.py on the host (see pyproject.toml).
#
# Configure ports binding in .env or in UI.
#
# Images are built from the Dockerfiles under DOCKERFILES_DIR (see x-images
# below); persistent data is bind-mounted from ./images (see README for the
# naming plan).

name: lakehouse

# The five images, each built from DOCKERFILES_DIR/lakehouse-<name>. Services
# merge the one they run with `<<:`, so an image is defined once however many
# services share it. The directory is an absolute path set in .env: this
# repository and the one holding the Dockerfiles are cloned independently, so
# where one sits relative to the other is not fixed.
x-images:
  minio: &minio-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-minio
    image: lakehouse/minio
  mc: &mc-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-mc
    image: lakehouse/mc
  postgres: &postgres-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-postgres
    image: lakehouse/postgres
  lakekeeper: &lakekeeper-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-lakekeeper
    image: lakehouse/lakekeeper
  init: &init-image
    build: ${DOCKERFILES_DIR:?}/lakehouse-init
    image: lakehouse/init

services:
  minio:
    <<: *minio-image
    command:
      - "server"
      - "/data"
      - "--address"
      - ":${MINIO_API_PORT:?}"
      - "--console-address"
      - ":${MINIO_CONSOLE_PORT:?}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - ./images/minio/data:/data
    ports:
      - "${MINIO_API_PORT:?}:${MINIO_API_PORT:?}" # S3 API
      - "${MINIO_CONSOLE_PORT:?}:${MINIO_CONSOLE_PORT:?}" # web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_API_PORT}/minio/health/live"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 10s

  # One-shot: warehouse bucket + the non-root user Lakekeeper vends STS
  # credentials with (MinIO refuses AssumeRole for root).
  minio-init:
    <<: *mc-image
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/lakehouse/backend/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_API_PORT: ${MINIO_API_PORT:?}
      LAKEHOUSE_S3_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?}
      LAKEHOUSE_S3_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:?}
    volumes:
      - ./backend:/opt/lakehouse/backend:ro
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    <<: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # Read by the server and by every libpq client in the container,
      # pg_isready below included.
      PGPORT: ${POSTGRES_PORT:?}
    volumes:
      - ./images/postgres/data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:?}:${POSTGRES_PORT:?}" # catalog metadata DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 10s

  lakekeeper-migrate:
    <<: *lakekeeper-image
    restart: "no"
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:?}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:?}/${POSTGRES_DB}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT:?}/${POSTGRES_DB}
      LAKEKEEPER__LISTEN_PORT: ${LAKEKEEPER_PORT:?}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy

  lakekeeper:
    <<: *lakekeeper-image
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "${LAKEKEEPER_PORT:?}:${LAKEKEEPER_PORT:?}" # REST catalog + management API + UI
    healthcheck:
      # Probes LAKEKEEPER__LISTEN_PORT, so it follows the variable too.
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # One-shot: bootstrap the catalog, create the warehouse on MinIO, and point
  # an existing warehouse at MinIO's current port.
  lakekeeper-init:
    <<: *init-image
    restart: "no"
    command: ["bash", "/opt/lakehouse/backend/lakekeeper-init.sh"]
    environment:
      LAKEHOUSE_WAREHOUSE: ${LAKEHOUSE_WAREHOUSE:?}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:?}
      LAKEHOUSE_S3_ACCESS_KEY: ${LAKEHOUSE_S3_ACCESS_KEY:?}
      LAKEHOUSE_S3_SECRET_KEY: ${LAKEHOUSE_S3_SECRET_KEY:?}
      LAKEKEEPER_PORT: ${LAKEKEEPER_PORT:?}
      MINIO_API_PORT: ${MINIO_API_PORT:?}
    volumes:
      - ./backend:/opt/lakehouse/backend:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
